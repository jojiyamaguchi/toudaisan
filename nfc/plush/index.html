<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/images/toudaisan_concept1.png">
  <title>魔法のスケッチブック | 灯台さんと魔法の本</title>
  <meta name="robots" content="noindex, follow">
  <script src="/plush-bonus.js?v=8"></script>
  <script>
    (function () {
      'use strict';

      var routes = {
        bradleyshead: {
          ja: '/plush/toudaisan/bradleyshead/',
          en: '/plush_en/toudaisan/bradleyshead/',
          bonusCount: 4
        },
        concept: {
          ja: '/plush/toudaisan/concept/',
          en: '/plush_en/toudaisan/concept/',
          bonusCount: 5
        },
        lighthousebaby: {
          ja: '/plush/lighthousebaby/',
          en: '/plush_en/lighthousebaby/',
          bonusCount: 10
        },
        burnham: {
          ja: '/plush/toudaisan/burnham/',
          en: '/plush_en/toudaisan/burnham/',
          bonusCount: 6
        },
        arahisa: {
          ja: '/plush/toudaisan/arahisa/',
          en: '/plush_en/toudaisan/arahisa/',
          bonusCount: 5
        },
        ancestor: {
          ja: '/plush/toudaisan/ancestor/',
          en: '/plush_en/toudaisan/ancestor/',
          bonusCount: 4
        },
        ishikari: {
          ja: '/plush/toudaisan/ishikari/',
          en: '/plush_en/toudaisan/ishikari/',
          bonusCount: 5
        },
        amedee: {
          ja: '/plush/toudaisan/amedee/',
          en: '/plush_en/toudaisan/amedee/',
          bonusCount: 4
        }
      };
      var parameters = new URLSearchParams(window.location.search);
      var requestedType = (parameters.get('type') || 'concept').toLowerCase();
      var selectedType = Object.prototype.hasOwnProperty.call(routes, requestedType)
        ? requestedType
        : 'concept';
      var requestedLanguage = (parameters.get('lang') || 'ja').toLowerCase();

      if (requestedLanguage === 'jp') {
        requestedLanguage = 'ja';
      }

      if (requestedLanguage !== 'en') {
        requestedLanguage = 'ja';
      }

      var route = routes[selectedType];
      var localizedBonuses = window.toudaisanPlushBonuses
        && window.toudaisanPlushBonuses[selectedType]
        && window.toudaisanPlushBonuses[selectedType][requestedLanguage];
      var bonusIndex = localizedBonuses && localizedBonuses.length
        ? Math.floor(Math.random() * localizedBonuses.length)
        : 0;

      window.toudaisanNfcDestination = route[requestedLanguage];
      window.toudaisanNfcBonusText = localizedBonuses && localizedBonuses[bonusIndex]
        ? localizedBonuses[bonusIndex]
        : '';
      document.documentElement.lang = requestedLanguage;

      try {
        window.sessionStorage.removeItem('toudaisan-plush-bonus');
      } catch (error) {
        // The NFC experience still works when temporary storage is unavailable.
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --paper-shadow: rgba(10, 3, 0, 0.62);
      --glow: rgba(239, 188, 93, 0.23);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #140c08;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: #f4ead9;
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .intro {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
      cursor: pointer;
      perspective: 1800px;
      background:
        radial-gradient(circle at 50% 47%, var(--glow) 0, rgba(65, 35, 19, 0.22) 30%, transparent 62%),
        linear-gradient(145deg, #0f0806 0%, #28170f 48%, #120a07 100%);
    }

    .intro::before {
      position: absolute;
      inset: -25%;
      z-index: -1;
      background:
        repeating-radial-gradient(circle at 40% 45%, rgba(255, 225, 164, 0.025) 0 1px, transparent 1px 5px);
      content: '';
      opacity: 0.5;
      animation: ambient-drift 12s ease-in-out infinite alternate;
    }

    .book {
      position: relative;
      width: min(94vw, calc(88dvh * 4 / 3));
      aspect-ratio: 4 / 3;
      opacity: 0;
      transform: translateX(-25%) scale(0.08) translateZ(-700px);
      transform-style: preserve-3d;
      filter: blur(8px) brightness(0.48);
      will-change: transform, opacity, filter;
    }

    .intro.is-approaching .book {
      animation: book-approach 1.8s cubic-bezier(0.18, 0.8, 0.2, 1) forwards;
    }

    .intro.is-opening .book {
      opacity: 1;
      transform: translateX(-25%) scale(1);
      filter: none;
      animation: book-center 2.5s cubic-bezier(0.45, 0.04, 0.18, 1) forwards;
    }

    .intro.is-open .book {
      opacity: 1;
      transform: translateX(0) scale(1);
      filter: none;
    }

    .spread {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateZ(-2px);
      transition: opacity 220ms ease 120ms;
    }

    .intro.is-opening .spread,
    .intro.is-open .spread {
      opacity: 1;
    }

    .page {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      overflow: hidden;
      background: #c9a875;
      box-shadow: 0 24px 70px var(--paper-shadow);
    }

    .page--left {
      left: 0;
      z-index: 2;
      border-radius: 10px 1px 1px 10px;
      transform-origin: right center;
      transform: rotateY(1.5deg);
      opacity: 0;
      visibility: hidden;
    }

    .intro.is-open .page--left {
      opacity: 1;
      visibility: visible;
    }

    .page--right {
      right: 0;
      border-radius: 1px 10px 10px 1px;
      transform-origin: left center;
      transform: rotateY(-1.5deg);
    }

    .page::after {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      content: '';
    }

    .page--right::after {
      background: linear-gradient(to right, rgba(57, 30, 14, 0.2), transparent 9%);
    }

    .page img,
    .cover__back img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .page__motion {
      z-index: 1;
    }

    .page__still {
      z-index: 2;
      opacity: 1;
      transition: opacity 1.1s ease;
      will-change: opacity;
    }

    .intro.is-alive .page__still {
      opacity: 0;
    }

    .cover {
      position: absolute;
      top: 0;
      left: 50%;
      z-index: 8;
      width: 50%;
      height: 100%;
      border-radius: 10px;
      transform: rotateY(0deg);
      transform-origin: left center;
      transform-style: preserve-3d;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.75);
      will-change: transform, opacity;
    }

    .cover__face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .cover__front {
      transform: translateZ(1px);
    }

    .cover__front img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .cover__back {
      border-radius: 10px 0 0 10px;
      transform: rotateY(180deg) translateZ(1px);
      background:
        linear-gradient(90deg, rgba(49, 24, 12, 0.28), transparent 10%),
        #b99461;
      box-shadow:
        inset 0 0 38px rgba(48, 25, 13, 0.32),
        0 24px 70px var(--paper-shadow);
    }

    .cover__back::after {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(to left, rgba(57, 30, 14, 0.2), transparent 9%);
      content: '';
    }

    .intro.is-opening .cover {
      animation: cover-open 2.5s cubic-bezier(0.45, 0.04, 0.16, 1) forwards;
    }

    .intro.is-open .cover {
      transform: rotateY(-180deg);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      box-shadow: -10px 20px 50px rgba(0, 0, 0, 0.32);
    }

    .spine {
      position: absolute;
      top: 1%;
      bottom: 1%;
      left: 50%;
      z-index: 9;
      width: 3px;
      transform: translateX(-50%);
      background: linear-gradient(to right, rgba(33, 15, 7, 0.45), rgba(255, 221, 160, 0.18), rgba(33, 15, 7, 0.45));
      box-shadow: 0 0 14px rgba(32, 13, 5, 0.38);
      opacity: 0;
      transition: opacity 420ms ease 1.6s;
    }

    .intro.is-opening .spine,
    .intro.is-open .spine {
      opacity: 1;
    }

    .skip-hint {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 20;
      margin: 0;
      padding: 8px 13px;
      border: 1px solid rgba(244, 234, 217, 0.24);
      border-radius: 999px;
      background: rgba(17, 9, 6, 0.46);
      color: rgba(244, 234, 217, 0.75);
      font-size: 0.82rem;
      line-height: 1;
      letter-spacing: 0.04em;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .bonus-reveal {
      position: absolute;
      inset: 7% 4%;
      z-index: 12;
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(18px) scale(0.98);
      transition:
        opacity 900ms ease,
        transform 1000ms cubic-bezier(0.2, 0.75, 0.22, 1),
        visibility 0s linear 1000ms;
    }

    .intro.is-bonus-visible .bonus-reveal {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition-delay: 0s;
    }

    .bonus-card {
      width: min(82%, 760px);
      max-height: 88%;
      overflow: auto;
      padding: clamp(13px, 2.8vw, 28px);
      color: #4b3322;
      text-align: center;
      background:
        linear-gradient(rgba(255, 247, 224, 0.94), rgba(239, 218, 174, 0.94)),
        #ead5a8;
      border: 1px solid rgba(105, 67, 35, 0.4);
      border-radius: clamp(8px, 1.4vw, 15px);
      box-shadow:
        0 14px 35px rgba(48, 25, 13, 0.32),
        inset 0 0 30px rgba(123, 80, 36, 0.12);
      scrollbar-width: thin;
    }

    .bonus-reveal__label {
      margin: 0 0 0.5em;
      color: #8a5b2c;
      font-size: clamp(0.58rem, 1.35vw, 0.78rem);
      font-weight: 800;
      letter-spacing: 0.13em;
    }

    .bonus-reveal__text {
      margin: 0;
      font-family: ui-serif, "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      font-size: clamp(0.72rem, 1.9vw, 1.12rem);
      font-weight: 650;
      line-height: 1.72;
      text-wrap: pretty;
    }

    .bonus-reveal__secret {
      margin: 0.9em 0 0;
      color: #755a43;
      font-size: clamp(0.54rem, 1.25vw, 0.72rem);
      line-height: 1.55;
    }

    .bonus-reveal__button {
      min-width: 90px;
      margin-top: clamp(9px, 1.8vw, 16px);
      padding: 8px 24px;
      border: 1px solid #6b4426;
      border-radius: 999px;
      color: #fff7e8;
      background: #704524;
      font: inherit;
      font-size: clamp(0.72rem, 1.5vw, 0.9rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(64, 34, 17, 0.25);
    }

    .bonus-reveal__button:hover,
    .bonus-reveal__button:focus-visible {
      background: #8a572d;
      outline: 2px solid #d49a4a;
      outline-offset: 3px;
    }

    .bonus-reveal__button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    @keyframes book-approach {
      0% {
        opacity: 0;
        transform: translateX(-25%) scale(0.08) translateZ(-700px);
        filter: blur(8px) brightness(0.48);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translateX(-25%) scale(1) translateZ(0);
        filter: blur(0) brightness(1);
      }
    }

    @keyframes book-center {
      from {
        transform: translateX(-25%) scale(1);
      }
      to {
        transform: translateX(0) scale(1);
      }
    }

    @keyframes cover-open {
      0% {
        transform: rotateY(0deg);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.75);
      }
      52% {
        box-shadow: 18px 24px 66px rgba(0, 0, 0, 0.58);
      }
      100% {
        transform: rotateY(-180deg);
        box-shadow: -10px 20px 50px rgba(0, 0, 0, 0.32);
      }
    }

    @keyframes ambient-drift {
      from {
        transform: translate3d(-1%, -1%, 0) rotate(-1deg);
      }
      to {
        transform: translate3d(1%, 1%, 0) rotate(1deg);
      }
    }

    @media (max-width: 640px) {
      .bonus-reveal {
        inset: 5% 2.5%;
      }

      .bonus-card {
        width: 91%;
        max-height: 92%;
        padding: 11px 14px;
      }

      .bonus-reveal__text {
        font-size: clamp(0.66rem, 2.75vw, 0.84rem);
        line-height: 1.58;
      }

      .bonus-reveal__secret {
        margin-top: 0.65em;
        font-size: clamp(0.5rem, 2.1vw, 0.66rem);
      }

      .bonus-reveal__button {
        margin-top: 7px;
        padding: 7px 22px;
      }

      .book {
        width: min(98vw, calc(82dvh * 4 / 3));
      }

      .page--left {
        border-radius: 5px 0 0 5px;
      }

      .page--right {
        border-radius: 0 5px 5px 0;
      }

      .cover {
        border-radius: 5px;
      }

      .cover__back {
        border-radius: 5px 0 0 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro::before,
      .intro.is-approaching .book,
      .intro.is-opening .book,
      .intro.is-opening .cover {
        animation: none;
      }

      .page__still {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="intro" id="nfc-intro" aria-label="魔法のスケッチブックが開くアニメーションです。">
    <div class="book">
      <div class="spread">
        <div class="page page--left">
          <img class="page__motion" src="/MagicSketchbookPageL.gif" alt="">
          <img class="page__still" src="/MagicSketchbookPageL.png" alt="">
        </div>
        <div class="page page--right">
          <img class="page__motion" src="/MagicSketchbookPageR.gif" alt="">
          <img class="page__still" src="/MagicSketchbookPageR.png" alt="">
        </div>
      </div>
      <div class="spine"></div>

      <div class="cover">
        <div class="cover__face cover__front">
          <img src="/MagicSketchbookCover.png" alt="">
        </div>
        <div class="cover__face cover__back">
          <img class="page__motion" src="/MagicSketchbookPageL.gif" alt="">
          <img class="page__still" src="/MagicSketchbookPageL.png" alt="">
        </div>
      </div>

      <section class="bonus-reveal" id="bonus-reveal" role="dialog" aria-labelledby="bonus-reveal-label" aria-describedby="bonus-reveal-text bonus-reveal-secret" aria-hidden="true">
        <div class="bonus-card">
          <p class="bonus-reveal__label" id="bonus-reveal-label">ぬいぐるみ特典</p>
          <p class="bonus-reveal__text" id="bonus-reveal-text"></p>
          <p class="bonus-reveal__secret" id="bonus-reveal-secret">これはぬいぐるみをスキャンした時にだけ表示される秘密情報です</p>
          <button class="bonus-reveal__button" id="bonus-reveal-ok" type="button" disabled>OK</button>
        </div>
      </section>
    </div>

    <p class="skip-hint" id="skip-hint">本が開くまでお待ちください</p>
  </main>

  <noscript>
    <p><a href="/plush/toudaisan/concept/">プロフィールを開く</a></p>
  </noscript>

  <script>
    (function () {
      'use strict';

      var intro = document.getElementById('nfc-intro');
      var hint = document.getElementById('skip-hint');
      var bonusPanel = document.getElementById('bonus-reveal');
      var bonusLabel = document.getElementById('bonus-reveal-label');
      var bonusText = document.getElementById('bonus-reveal-text');
      var secretText = document.getElementById('bonus-reveal-secret');
      var okButton = document.getElementById('bonus-reveal-ok');
      var destination = window.toudaisanNfcDestination || '/plush/toudaisan/concept/';
      var selectedBonus = window.toudaisanNfcBonusText || '';
      var hasNavigated = false;
      var animationStarted = false;
      var bonusVisible = false;
      var timers = [];
      var isEnglish = document.documentElement.lang === 'en';
      var reducedMotion = window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      bonusLabel.textContent = isEnglish ? 'PLUSH BONUS' : 'ぬいぐるみ特典';
      bonusText.textContent = selectedBonus;
      secretText.textContent = isEnglish
        ? 'This is secret information shown only when you scan the plush.'
        : 'これはぬいぐるみをスキャンした時にだけ表示される秘密情報です';
      hint.textContent = isEnglish
        ? 'Please wait for the book to open'
        : '本が開くまでお待ちください';

      intro.setAttribute(
        'aria-label',
        isEnglish
          ? 'An animation of the Magic Sketchbook opening.'
          : '魔法のスケッチブックが開くアニメーションです。'
      );

      function schedule(callback, delay) {
        timers.push(window.setTimeout(callback, delay));
      }

      function showBonus() {
        if (bonusVisible || hasNavigated) {
          return;
        }

        bonusVisible = true;
        intro.classList.add('is-bonus-visible');
        bonusPanel.setAttribute('aria-hidden', 'false');
        okButton.disabled = false;
        hint.hidden = true;
        intro.setAttribute(
          'aria-label',
          isEnglish
            ? 'A plush bonus has appeared inside the Magic Sketchbook. Press OK to open the profile.'
            : '魔法のスケッチブックの中にぬいぐるみ特典が現れました。OKを押すとプロフィールを開きます。'
        );

        window.setTimeout(function () {
          okButton.focus({ preventScroll: true });
        }, 950);
      }

      function goToProfile() {
        if (hasNavigated || !bonusVisible) {
          return;
        }

        hasNavigated = true;
        timers.forEach(window.clearTimeout);

        try {
          window.sessionStorage.removeItem('toudaisan-plush-bonus');
        } catch (error) {
          // Navigation still works when temporary storage is unavailable.
        }

        window.location.replace(destination);
      }

      okButton.addEventListener('click', goToProfile);

      function startAnimation() {
        if (animationStarted || hasNavigated) {
          return;
        }

        animationStarted = true;

        if (reducedMotion) {
          intro.classList.add('is-open', 'is-alive');
          schedule(showBonus, 350);
          return;
        }

        window.requestAnimationFrame(function () {
          intro.classList.add('is-approaching');
        });

        schedule(function () {
          intro.classList.remove('is-approaching');
          intro.classList.add('is-opening');
        }, 1800);

        schedule(function () {
          intro.classList.remove('is-opening');
          intro.classList.add('is-open');
        }, 4300);

        schedule(function () {
          intro.classList.add('is-alive');
        }, 7300);

        schedule(showBonus, 8500);
      }

      var essentialImages = Array.prototype.slice.call(
        document.querySelectorAll('.cover__front img, .page__still')
      );
      var imagesWaiting = essentialImages.filter(function (image) {
        return !image.complete;
      }).length;

      function markImageReady() {
        imagesWaiting -= 1;
        if (imagesWaiting <= 0) {
          startAnimation();
        }
      }

      essentialImages.forEach(function (image) {
        if (!image.complete) {
          image.addEventListener('load', markImageReady, { once: true });
          image.addEventListener('error', markImageReady, { once: true });
        }
      });

      if (imagesWaiting === 0) {
        startAnimation();
      } else {
        schedule(startAnimation, 3500);
      }
    })();
  </script>/body>

</html>
