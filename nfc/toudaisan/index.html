<!DOCTYPE html>
<html lang="ja" data-language-router data-ja-path="/plush/toudaisan/concept/" data-en-path="/plush_en/toudaisan/concept/">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/toudaisan_concept1.png">
  <title>灯台さんのページを開いています | 灯台さん.com</title>
  <meta name="robots" content="noindex, follow">
  <script>
    (function () {
      var routes = {
        concept: {
          ja: '/plush/toudaisan/concept/',
          en: '/plush_en/toudaisan/concept/',
          bonusCount: 5
        }
      };
      var parameters = new URLSearchParams(window.location.search);
      var requestedType = (parameters.get('type') || 'concept').toLowerCase();
      var selectedType = Object.prototype.hasOwnProperty.call(routes, requestedType)
        ? requestedType
        : 'concept';
      var route = routes[selectedType];
      var bonusIndex = Math.floor(Math.random() * route.bonusCount);
      var navigationParameters = new URLSearchParams({
        nfc: '1',
        type: selectedType,
        bonus: String(bonusIndex)
      });

      document.documentElement.dataset.jaPath = route.ja + '?' + navigationParameters.toString();
      document.documentElement.dataset.enPath = route.en + '?' + navigationParameters.toString();
    })();
  </script>
  <script src="/language.js"></script>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #2a1a12;
      color: #f4efe6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    main {
      width: min(520px, calc(100% - 40px));
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }

    p {
      margin: 0 0 22px;
      color: rgba(244, 239, 230, 0.74);
      line-height: 1.7;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    a {
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.14);
      color: #f4efe6;
      text-decoration: none;
    }

    a:hover {
      background: rgba(246, 210, 122, 0.18);
    }
  </style>
</head>

<body>
  <main>
    <h1>灯台さんのページを開いています</h1>
    <p>自動的に移動しない場合は、言語を選んでください。<br>Please select a language if you are not redirected.</p>
    <nav aria-label="Language selection">
      <a href="/plush/toudaisan/concept/?nfc=1&type=concept&lang=jp" data-set-language="ja" lang="ja">日本語</a>
      <a href="/plush_en/toudaisan/concept/?nfc=1&type=concept&lang=en" data-set-language="en" lang="en">English</a>
    </nav>
  </main>
  <script src="/site-footer.js"></script>
</body>

</html>
