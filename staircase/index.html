<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/images/toudaisan_concept1.png">
  <link rel="canonical" href="https://www.toudaisan.com/staircase/">
  <title id="pageTitle">灯台さんと魔法の本｜階段</title>
  <meta name="description" id="pageDescription" content="灯台の中の階段を上りながら、灯台さんたちに出会うページです。">
  <style>
    :root{
      --ink:#2b211b;
      --ink-soft:#5f5146;
      --paper:#d7c5a4;
      --paper-light:#eadcbe;
      --stone:#9d8e78;
      --stone-dark:#62594f;
      --metal:#3f3933;
      --gold:#d9aa4e;
      --shadow:rgba(25,18,13,.34);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-width:0;
      color:#eee4d2;
      font-family:ui-serif,"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif;
      background:#17120f;
      overflow-x:hidden;
    }
    .topbar{
      position:fixed;
      z-index:20;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:min(940px,calc(100% - 24px));
      min-height:66px;
      padding:11px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      background:rgba(42,31,24,.90);
      color:#f4ead7;
      border:1px solid rgba(255,255,255,.13);
      border-top:0;
      border-radius:0 0 18px 18px;
      box-shadow:0 12px 32px rgba(31,22,17,.24);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .topbar__title{
      min-width:0;
      font-size:clamp(15px,2.4vw,20px);
      font-weight:700;
      letter-spacing:.05em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .topbar__actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
    .pill{
      color:#f4ead7;
      text-decoration:none;
      border:1px solid rgba(255,255,255,.24);
      border-radius:999px;
      padding:8px 11px;
      font-size:14px;
      line-height:1;
      background:rgba(255,255,255,.06);
    }
    .pill[aria-current="page"]{
      color:#2b211b;
      background:#efd188;
      border-color:#efd188;
    }
    .home{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      font-size:21px;
      padding:0;
    }
    main{
      width:min(960px,100%);
      margin:0 auto;
      padding:96px 0 130px;
    }
    .stairwell{
      position:relative;
      isolation:isolate;
      overflow:hidden;
      background:#443a31;
      box-shadow:0 0 55px rgba(0,0,0,.52);
    }
    .stairwell-background{
      position:relative;
      z-index:0;
      width:100%;
      pointer-events:none;
    }
    .stairwell-background img{
      display:block;
      width:100%;
      height:auto;
      margin:0;
    }
    .character{
      position:absolute;
      left:0;
      width:100%;
      height:25%;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      text-decoration:none;
      color:inherit;
      outline-offset:8px;
      z-index:3;
    }
    .character::before{
      content:"";
      position:absolute;
      bottom:-46px;
      width:min(58vw,560px);
      height:190px;
      z-index:0;
      pointer-events:none;
      background:radial-gradient(ellipse at 50% 70%,
        rgba(246,205,117,.34) 0%,
        rgba(224,171,82,.17) 34%,
        rgba(183,124,52,.07) 53%,
        transparent 74%);
      filter:blur(10px);
    }
    .character--left::before{left:-5vw}
    .character--right::before{right:-5vw}
    #babyLink{top:25%}
    #bradleyLink{top:50%}
    #conceptLink{top:75%}
    .character--left{align-items:flex-start}
    .character--right{align-items:flex-end}
    .portrait-wrap{
      position:relative;
      z-index:3;
      width:25vw;
      min-width:96px;
      max-width:360px;
      aspect-ratio:4/5;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      transition:transform .25s ease;
    }
    .character--left .portrait-wrap,
    .character--left .nameplate{margin-left:clamp(10px,4vw,48px)}
    .character--right .portrait-wrap,
    .character--right .nameplate{margin-right:clamp(10px,4vw,48px)}
    .character:hover .portrait-wrap,
    .character:focus-visible .portrait-wrap{transform:translateY(-7px)}
    .portrait{
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center bottom;
      mix-blend-mode:multiply;
      filter:drop-shadow(0 14px 12px rgba(42,31,24,.24));
    }
    .nameplate{
      position:relative;
      z-index:5;
      max-width:min(44vw,390px);
      margin-top:-3px;
      padding:9px 15px;
      text-align:center;
      font-size:clamp(16px,2.6vw,22px);
      font-weight:700;
      letter-spacing:.04em;
      color:#f0dfba;
      background:rgba(28,22,18,.88);
      border:1px solid rgba(225,184,102,.34);
      border-radius:10px;
      box-shadow:0 8px 18px rgba(43,33,27,.14);
    }
    .creator-portal{
      display:flex;
      justify-content:center;
      padding:72px 20px 0;
      text-align:center;
    }
    .creator-link{
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      color:#f6d27a;
      font-size:clamp(20px,3.5vw,28px);
      font-weight:700;
      letter-spacing:.06em;
      text-decoration:none;
    }
    .creator-cover{
      display:block;
      width:min(135px,29vw);
      height:auto;
      border-radius:8px;
      box-shadow:0 22px 48px rgba(0,0,0,.48);
      transition:transform .25s ease,box-shadow .25s ease;
    }
    .creator-link:hover .creator-cover,
    .creator-link:focus-visible .creator-cover{
      transform:translateY(-6px);
      box-shadow:0 28px 56px rgba(0,0,0,.56);
    }
    .creator-link:focus-visible{
      outline:3px solid #f6d27a;
      outline-offset:8px;
      border-radius:8px;
    }
    .creator-link__label{
      text-decoration:underline;
      text-underline-offset:6px;
    }
    .direction{
      position:absolute;
      left:50%;
      bottom:17px;
      transform:translateX(-50%);
      font-size:30px;
      color:rgba(54,45,38,.52);
      animation:rise 1.8s ease-in-out infinite;
    }
    @keyframes rise{
      0%,100%{transform:translate(-50%,5px)}
      50%{transform:translate(-50%,-5px)}
    }
    @media (max-width:620px){
      .topbar__title{max-width:42vw}
      .pill{font-size:13px;padding:8px 9px}
    }
    @media (max-width:390px){
      .topbar{gap:8px}
      .topbar__actions{gap:5px}
      .nameplate{font-size:15px;padding:8px 9px}
    }
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .direction{animation:none}
      .portrait-wrap,
      .creator-cover{transition:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__title" id="worldTitle">灯台さんと魔法の本</div>
    <div class="topbar__actions">
      <a class="pill home" id="homeLink" href="/?lang=jp" aria-label="トップページ">⌂</a>
      <a class="pill" id="jaLink" href="/staircase/?lang=jp" lang="ja">日本語</a>
      <a class="pill" id="enLink" href="/staircase/?lang=en" lang="en">English</a>
    </div>
  </header>

  <main>
    <div class="stairwell" aria-label="キャラクターの階段">
      <div class="stairwell-background" aria-hidden="true">
        <img src="/images/stairs.png?v=1" alt="">
        <img src="/images/stairs.png?v=1" alt="">
      </div>

      <a class="character character--left" id="babyLink" href="/plush/lighthousebaby/?lang=jp">
        <div class="portrait-wrap">
          <img class="portrait" src="/images/lighthousebaby1.png" alt="灯台の赤ちゃん">
        </div>
        <div class="nameplate" data-name="baby">灯台の赤ちゃん</div>
      </a>


      <div class="character character--right" id="bradleyLink">
        <div class="portrait-wrap">
          <img class="portrait" src="/images/toudaisan_bradleyshead1.png" alt="灯台さん(ブラッドリーヘッド)">
        </div>
        <div class="nameplate" data-name="bradley">灯台さん(ブラッドリーヘッド)</div>
      </div>


      <a class="character character--left" id="conceptLink" href="/plush/toudaisan/concept/?lang=jp">
        <div class="portrait-wrap">
          <img class="portrait" src="/images/toudaisan_concept1.png" alt="灯台さん（概念）">
        </div>
        <div class="nameplate" data-name="concept">灯台さん（概念）</div>
      </a>

      <div class="direction" aria-hidden="true">↑</div>
    </div>

    <section class="creator-portal" aria-label="作者プロフィール">
      <a class="creator-link" id="creatorLink" href="/magicbook/?lang=jp">
        <img class="creator-cover" src="/MagicSketchbookCover.png" alt="魔法のスケッチブックの表紙">
        <span class="creator-link__label" id="creatorLabel">魔法Book</span>
      </a>
    </section>
  </main>

  <script>
    const copy = {
      ja:{
        title:"灯台さんと魔法の本｜階段",
        description:"灯台の中の階段を上りながら、灯台さんたちに出会うページです。",
        world:"灯台さんと魔法の本",
        home:"トップページ",
        aria:"キャラクターの階段",
        bradley:"灯台さん(ブラッドリーヘッド)",
        concept:"灯台さん（概念）",
        baby:"灯台の赤ちゃん",
        creator:"魔法Book",
        creatorAria:"作者プロフィール",
        creatorCover:"魔法のスケッチブックの表紙"
      },
      en:{
        title:"Mr Lighthouse and the Magic Sketchbook | Staircase",
        description:"Climb the staircase inside the lighthouse and meet its characters.",
        world:"Mr Lighthouse and the Magic Sketchbook",
        home:"Top page",
        aria:"Character staircase",
        bradley:"Mr. Lighthouse (Bradley’s Head)",
        concept:"Mr Lighthouse (Concept)",
        baby:"Lighthouse Baby",
        creator:"Magic Sketchbook",
        creatorAria:"Creator profile",
        creatorCover:"Magic Sketchbook cover"
      }
    };

    document.addEventListener("DOMContentLoaded",()=>{
      const parameters = new URLSearchParams(location.search);
      const lang = parameters.get("lang") === "en" ? "en" : "ja";
      const fromTopPage = parameters.get("from") === "top";
      const t = copy[lang];
      document.documentElement.lang = lang;
      document.getElementById("pageTitle").textContent = t.title;
      document.getElementById("pageDescription").content = t.description;
      document.getElementById("worldTitle").textContent = t.world;
      document.querySelector(".stairwell").setAttribute("aria-label",t.aria);
      document.getElementById("homeLink").setAttribute("aria-label",t.home);
      document.getElementById("homeLink").href = "/?lang=" + (lang === "en" ? "en" : "jp");
      document.getElementById("jaLink").setAttribute("aria-current",lang === "ja" ? "page" : "false");
      document.getElementById("enLink").setAttribute("aria-current",lang === "en" ? "page" : "false");
      document.querySelector(".creator-portal").setAttribute("aria-label",t.creatorAria);
      document.getElementById("creatorLink").href = lang === "en" ? "/magicbook_en/?lang=en" : "/magicbook/?lang=jp";
      document.getElementById("creatorLabel").textContent = t.creator;
      document.querySelector(".creator-cover").alt = t.creatorCover;

      const routes = lang === "en"
        ? {
            baby:"/plush_en/lighthousebaby/?lang=en",
            concept:"/plush_en/toudaisan/concept/?lang=en",
            bradley:"/plush/toudaisan/?lang=jp"
          }
        : {
            baby:"/plush/lighthousebaby/?lang=jp",
            concept:"/plush/toudaisan/concept/?lang=jp",
            bradley:"/plush/toudaisan/?lang=jp"
          };

      ["baby","concept","bradley"].forEach(key=>{
        const link = document.getElementById(key + "Link");
        link.href = routes[key];
        link.querySelector("[data-name]").textContent = t[key];
        link.querySelector("img").alt = t[key];
      });

      if (fromTopPage) {
        if ("scrollRestoration" in history) {
          history.scrollRestoration = "manual";
        }

        const scrollToStairsBottom = () => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              const stairwell = document.querySelector(".stairwell");
              const stairwellBottom = stairwell.getBoundingClientRect().bottom + window.scrollY;
              const targetPosition = Math.max(0,stairwellBottom - window.innerHeight);
              window.scrollTo(0,targetPosition);
            });
          });
        };
        const backgroundImages = Array.from(document.querySelectorAll(".stairwell-background img"));
        const imagesReady = backgroundImages.map(image => {
          if (image.complete) return Promise.resolve();
          return new Promise(resolve => {
            image.addEventListener("load",resolve,{once:true});
            image.addEventListener("error",resolve,{once:true});
          });
        });

        Promise.all(imagesReady).then(scrollToStairsBottom);
        window.addEventListener("load",scrollToStairsBottom,{once:true});
        window.addEventListener("pageshow",scrollToStairsBottom,{once:true});
      } else if (!location.hash) {
        requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight));
      }
    });
  </script>
  <script src="/site-footer.js"></script>
</body>
</html>
